<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Carlos Muñoz Arenas - Software Engineer</title>
  <desc id="desc">Banner verde agua y negro para perfil GitHub con stack Spring Boot y Angular.</desc>

  <!-- ====== COLORES ====== -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b1f24"/>       <!-- negro suave -->
      <stop offset="100%" stop-color="#20c997"/>     <!-- verde agua -->
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#20c997" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#20c997" stop-opacity=".25"/>
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="blur"/>
      <feOffset dx="0" dy="4" result="offset"/>
      <feMerge>
        <feMergeNode in="offset"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ====== FONDO ====== -->
  <rect width="1200" height="400" fill="url(#bg)"/>
  <path d="M0,300 C200,260 320,340 520,310 C760,270 880,360 1200,320 L1200,400 L0,400 Z" fill="url(#wave)"/>
  <path d="M0,330 C220,300 360,360 560,340 C800,320 920,370 1200,350 L1200,400 L0,400 Z" fill="#ffffff" opacity=".06"/>

  <!-- ====== TARJETA ====== -->
  <g filter="url(#shadow)">
    <rect x="80" y="70" width="1040" height="260" rx="24" fill="rgba(0,0,0,0.3)" stroke="#20c997" stroke-width="2"/>
  </g>

  <!-- ====== TEXTO ====== -->
  <text x="120" y="160" font-family="Segoe UI, Roboto, Ubuntu, Cantarell, sans-serif"
        font-size="48" font-weight="700" fill="#20c997">Carlos Muñoz Arenas</text>

  <text x="120" y="205" font-family="Segoe UI, Roboto, Ubuntu, Cantarell, sans-serif"
        font-size="26" fill="#e5f8f1">Software Engineer</text>

  <!-- ====== STACK ====== -->
  <g transform="translate(120,260)">
    <!-- Chip Spring Boot -->
    <g>
      <rect x="0" y="-28" width="170" height="40" rx="12" fill="#20c997" opacity="0.2" stroke="#20c997" stroke-width="2"/>
      <text x="85" y="-4" text-anchor="middle"
            font-family="Segoe UI, Roboto, Ubuntu, Cantarell, sans-serif"
            font-size="18" fill="#20c997">Spring Boot</text>
    </g>
    <!-- Chip Angular -->
    <g transform="translate(190,0)">
      <rect x="0" y="-28" width="140" height="40" rx="12" fill="#20c997" opacity="0.2" stroke="#20c997" stroke-width="2"/>
      <text x="70" y="-4" text-anchor="middle"
            font-family="Segoe UI, Roboto, Ubuntu, Cantarell, sans-serif"
            font-size="18" fill="#20c997">Angular</text>
    </g>
  </g>

  <!-- DETALLES DECORATIVOS -->
  <circle cx="1080" cy="90" r="30" fill="#20c997" opacity=".2"/>
  <circle cx="1030" cy="130" r="10" fill="#20c997" opacity=".4"/>
  <circle cx="1100" cy="140" r="6" fill="#20c997" opacity=".5"/>
</svg>
